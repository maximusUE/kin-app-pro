<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="kinGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2ED5A4"/>
      <stop offset="100%" stop-color="#18A57E"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0" y1="120" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7047EB" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2ED5A4" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="30" fill="#121320" stroke="rgba(46,213,164,0.3)" stroke-width="1.5"/>
  <rect width="120" height="120" rx="30" fill="url(#purpleGlow)"/>
  <!-- K Monogram with liquidity forward arrows -->
  <path d="M38 32V88" stroke="url(#kinGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M78 36L46 60L78 84" stroke="url(#kinGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="46" cy="60" r="4" fill="#FFFFFF"/>
  <circle cx="78" cy="36" r="3" fill="#2ED5A4"/>
  <circle cx="78" cy="84" r="3" fill="#2ED5A4"/>
</svg>